<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pengurus Kata Laluan</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6 font-sans antialiased pb-24 sm:pb-8">
  <div class="max-w-2xl mx-auto space-y-4">

    <!-- Header Utama -->
    <header class="flex items-center justify-between pb-3 border-b border-slate-800">
      <div>
        <h1 class="text-xl sm:text-2xl font-bold text-teal-400">Pengurus Akaun</h1>
        <p class="text-xs text-slate-400">Google Sheets Cloud & IndexedDB Cache</p>
      </div>
      <div class="flex items-center space-x-2">
        <div id="networkStatus" class="flex items-center space-x-1.5 text-xs bg-slate-800 px-2.5 py-1 rounded-full border border-slate-700 text-slate-300">
          <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="networkText">Dalam Talian</span>
        </div>
        <button id="openModalBtn" type="button" class="inline-flex items-center space-x-1 bg-teal-500 hover:bg-teal-600 text-slate-950 font-semibold px-3 py-1.5 rounded-lg text-xs transition shadow-sm active:scale-95">
          <span>+ Tambah Akaun</span>
        </button>
      </div>
    </header>

    <!-- Bar Carian & Butang Segerak -->
    <div class="flex items-center gap-2">
      <div class="relative flex-1">
        <input type="text" id="searchInput" placeholder="Cari nama akaun atau ID..."
          class="w-full bg-slate-800/90 border border-slate-700 rounded-xl px-3.5 py-2 pl-9 text-xs sm:text-sm focus:outline-none focus:border-teal-400 text-slate-100 placeholder-slate-500" />
        <span class="absolute left-3 top-2.5 text-slate-500 text-xs">🔍</span>
      </div>
      <button id="syncBtn" type="button" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 rounded-xl text-xs text-teal-400 font-medium transition flex items-center gap-1 shrink-0">
        <span id="syncIcon">🔄</span>
        <span id="syncLabel">Segerak</span>
      </button>
    </div>

    <!-- Senarai Akaun -->
    <main class="space-y-2">
      <div id="recordsContainer" class="space-y-2.5">
        <p class="text-xs text-slate-500 italic py-6 text-center">Memuatkan data akaun...</p>
      </div>
    </main>

  </div>

  <!-- Butang Terapung (FAB) untuk Mobile -->
  <button id="fabBtn" type="button" class="sm:hidden fixed bottom-6 right-6 w-14 h-14 bg-teal-400 hover:bg-teal-500 text-slate-950 text-3xl font-bold rounded-full shadow-2xl flex items-center justify-center transition active:scale-90 z-30">
    +
  </button>

  <!-- Modal Popup: Tambah & Edit Rekod -->
  <div id="modalOverlay" style="display: none;" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 w-full max-w-md rounded-2xl p-5 shadow-2xl relative space-y-4">
      
      <div class="flex items-center justify-between border-b border-slate-700/80 pb-3">
        <h3 id="modalTitle" class="text-base font-semibold text-slate-100">Tambah Kelayakan Baharu</h3>
        <button type="button" id="closeModalBtn" class="text-slate-400 hover:text-slate-200 text-xl font-bold px-2 py-0.5">✕</button>
      </div>

      <form id="vaultForm" class="space-y-3.5">
        <input type="hidden" id="editRecordId" value="" />

        <div>
          <label class="block text-xs text-slate-400 mb-1">Nama Aplikasi / Servis</label>
          <input type="text" id="appName" placeholder="cth: Maybank2u, GitHub, MyCar" required
            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-400 text-slate-100" />
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Username / ID / Emel</label>
          <input type="text" id="username" placeholder="cth: user@domain.com" required
            class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-400 text-slate-100" />
        </div>

        <div>
          <label class="block text-xs text-slate-400 mb-1">Kata Laluan</label>
          <div class="relative">
            <input type="password" id="appPassword" placeholder="••••••••" required
              class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-400 text-slate-100 pr-10" />
            <button type="button" id="togglePasswordVisibility" class="absolute right-2.5 top-2.5 text-xs text-slate-400 hover:text-slate-200">
              👁️
            </button>
          </div>
        </div>

        <div class="flex justify-end gap-2 pt-2">
          <button type="button" id="cancelBtn" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs text-slate-200">
            Batal
          </button>
          <button type="submit" id="saveBtn" class="px-4 py-2 bg-teal-500 hover:bg-teal-600 text-slate-950 font-semibold rounded-lg text-xs transition">
            Simpan Kelayakan
          </button>
        </div>
      </form>

    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyreyrV-qAYe_EOrNGZFnp2dthtaAGaiOt5JWtWtJoiwzytRkglSuPC7BvjRa7Yv9YP/exec";

    // Pendaftaran Service Worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW failed:', err));
    }

    // Kawalan Modal
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const openModalBtn = document.getElementById('openModalBtn');
    const fabBtn = document.getElementById('fabBtn');
    const closeModalBtn = document.getElementById('closeModalBtn');
    const cancelBtn = document.getElementById('cancelBtn');
    const vaultForm = document.getElementById('vaultForm');
    const editRecordId = document.getElementById('editRecordId');

    function openModal(isEdit = false) {
      modalTitle.innerText = isEdit ? "Kemaskini Kelayakan" : "Tambah Kelayakan Baharu";
      modalOverlay.style.display = 'flex';
      setTimeout(() => document.getElementById('appName').focus(), 50);
    }

    function closeModal() {
      modalOverlay.style.display = 'none';
      vaultForm.reset();
      editRecordId.value = '';
    }

    openModalBtn.onclick = () => openModal(false);
    fabBtn.onclick = () => openModal(false);
    closeModalBtn.onclick = closeModal;
    cancelBtn.onclick = closeModal;
    modalOverlay.onclick = (e) => {
      if (e.target === modalOverlay) closeModal();
    };

    // Toggle kata laluan borang modal
    const passInput = document.getElementById('appPassword');
    document.getElementById('togglePasswordVisibility').onclick = () => {
      passInput.type = passInput.type === 'password' ? 'text' : 'password';
    };

    // Status Rangkaian
    const networkStatusEl = document.getElementById('networkStatus');
    function updateNetworkStatus() {
      if (navigator.onLine) {
        networkStatusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span><span>Dalam Talian</span>`;
      } else {
        networkStatusEl.innerHTML = `<span class="w-2 h-2 rounded-full bg-amber-500"></span><span>Luar Talian</span>`;
      }
    }
    window.addEventListener('online', () => { updateNetworkStatus(); syncData(true); });
    window.addEventListener('offline', updateNetworkStatus);
    updateNetworkStatus();

    // Modul IndexedDB (Cache Lokal)
    const DB_NAME = 'VaultCloudStoreDB';
    const STORE_NAME = 'accounts';

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: 'id' });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    async function getLocalRecords() {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readonly');
        const req = tx.objectStore(STORE_NAME).getAll();
        req.onsuccess = () => resolve(req.result || []);
        req.onerror = () => reject(req.error);
      });
    }

    async function putLocalRecord(record) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).put(record);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function removeLocalRecord(id) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        tx.objectStore(STORE_NAME).delete(id);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function replaceAllLocalRecords(records) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction(STORE_NAME, 'readwrite');
        const store = tx.objectStore(STORE_NAME);
        store.clear();
        records.forEach(r => store.put(r));
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    // Render Senarai
    let currentRecords = [];
    const container = document.getElementById('recordsContainer');
    const searchInput = document.getElementById('searchInput');

    function renderRecords(records) {
      container.innerHTML = '';
      if (!records || records.length === 0) {
        container.innerHTML = `<div class="bg-slate-800/40 border border-dashed border-slate-700/80 rounded-xl p-8 text-center text-xs text-slate-400">Tiada akaun ditemui. Tekan <b>+ Tambah Akaun</b> untuk mula menyimpan.</div>`;
        return;
      }

      records.forEach(rec => {
        const card = document.createElement('div');
        card.className = "bg-slate-800/80 hover:bg-slate-800 border border-slate-700/80 p-3.5 rounded-xl flex items-center justify-between gap-3 shadow-sm transition";
        card.innerHTML = `
          <div class="space-y-1 min-w-0 flex-1">
            <p class="font-semibold text-sm text-teal-300 truncate">${escapeHtml(rec.appName)}</p>
            <div class="text-xs text-slate-400 truncate">
              ID: <span class="text-slate-200 font-mono select-all">${escapeHtml(rec.username)}</span>
            </div>
            <div class="text-xs text-slate-400 flex items-center gap-2">
              <span>Pass:</span>
              <span class="font-mono text-emerald-400 font-medium select-all">${escapeHtml(rec.password)}</span>
            </div>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button onclick="copyToClipboard('${escapeAttr(rec.password)}', 'Kata laluan')" class="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs text-slate-200 transition">
              Salin
            </button>
            <button onclick="handleEdit('${rec.id}')" class="px-2.5 py-1.5 bg-slate-700 hover:bg-slate-600 rounded-lg text-xs text-amber-300 transition">
              Edit
            </button>
            <button onclick="handleDelete('${rec.id}')" class="px-2.5 py-1.5 bg-rose-950/40 border border-rose-900/80 text-rose-300 hover:bg-rose-900/60 rounded-lg text-xs transition">
              Padam
            </button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // Tapis Carian
    searchInput.oninput = (e) => {
      const q = e.target.value.toLowerCase().trim();
      if (!q) {
        renderRecords(currentRecords);
        return;
      }
      const filtered = currentRecords.filter(item => 
        (item.appName && item.appName.toLowerCase().includes(q)) ||
        (item.username && item.username.toLowerCase().includes(q))
      );
      renderRecords(filtered);
    };

    // Simpan Rekod (Hantar Cloud Dulu Baru Update Cache)
    vaultForm.onsubmit = async (e) => {
      e.preventDefault();
      const saveBtn = document.getElementById('saveBtn');
      const existingId = editRecordId.value;
      const appName = document.getElementById('appName').value.trim();
      const username = document.getElementById('username').value.trim();
      const password = document.getElementById('appPassword').value;

      const recordId = existingId || ('rec_' + Date.now());
      const payload = {
        action: existingId ? 'edit' : 'save',
        id: recordId,
        appName,
        username,
        password
      };

      saveBtn.disabled = true;
      saveBtn.innerText = "Menyimpan ke Cloud...";

      try {
        if (!navigator.onLine) {
          throw new Error("Peranti berada di luar talian");
        }

        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });

        const resData = await res.json();
        if (resData.status !== 'success') {
          throw new Error(resData.message || 'Gagal menyimpan di Google Sheets');
        }

        // Simpan ke storan lokal
        await putLocalRecord({ id: recordId, appName, username, password });
        closeModal();
        await loadLocalData();

        // Segerak semula untuk pastikan semua peranti sepadan
        await syncData(true);
      } catch (err) {
        console.warn('Ralat Cloud:', err);
        // Fallback simpan secara lokal jika sambungan gagal
        await putLocalRecord({ id: recordId, appName, username, password });
        closeModal();
        await loadLocalData();
        alert("Disimpan ke storan tempatan peranti ini sahaja: " + err.message);
      } finally {
        saveBtn.disabled = false;
        saveBtn.innerText = "Simpan Kelayakan";
      }
    };

    // Edit
    window.handleEdit = (id) => {
      const rec = currentRecords.find(item => item.id === id);
      if (!rec) return;

      editRecordId.value = rec.id;
      document.getElementById('appName').value = rec.appName || '';
      document.getElementById('username').value = rec.username || '';
      document.getElementById('appPassword').value = rec.password || '';
      openModal(true);
    };

    // Padam
    window.handleDelete = async (id) => {
      if (!confirm("Padam kelayakan akaun ini?")) return;

      await removeLocalRecord(id);
      await loadLocalData();

      if (navigator.onLine) {
        try {
          await fetch(API_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify({ action: 'delete', id })
          });
        } catch (err) {
          console.warn('Gagal memadam di Google Sheets:', err);
        }
      }
    };

    // Muat Turun Data Tempatan
    async function loadLocalData() {
      currentRecords = await getLocalRecords();
      renderRecords(currentRecords);
    }

    // Fungsi Segerak Penuh dengan Google Sheets
    async function syncData(silent = false) {
      if (!navigator.onLine) {
        if (!silent) alert("Peranti luar talian.");
        return;
      }

      const syncBtn = document.getElementById('syncBtn');
      const syncLabel = document.getElementById('syncLabel');
      const syncIcon = document.getElementById('syncIcon');

      if (syncLabel) syncLabel.innerText = "Menyegerak...";
      if (syncIcon) syncIcon.classList.add('animate-spin');

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'list' })
        });

        const data = await res.json();
        if (data && data.records) {
          await replaceAllLocalRecords(data.records);
          await loadLocalData();
          if (!silent) alert("Segerak selesai! (" + data.records.length + " rekod dimuat turun)");
        }
      } catch (err) {
        console.warn('Ralat penyegerakan:', err);
        if (!silent) alert("Gagal menyegerak: " + err.message);
      } finally {
        if (syncLabel) syncLabel.innerText = "Segerak";
        if (syncIcon) syncIcon.classList.remove('animate-spin');
      }
    }

    window.copyToClipboard = (text, label) => {
      navigator.clipboard.writeText(text);
      alert(`${label} disalin!`);
    };

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function escapeAttr(str) {
      return (str || '').replace(/'/g, "\\'").replace(/"/g, "&quot;");
    }

    document.getElementById('syncBtn').onclick = () => syncData(false);

    // Mula aplikasi: muat lokal dulu, kemudian segerak cloud automatik
    loadLocalData().then(() => syncData(true));
  </script>
</body>
</html>
