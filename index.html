<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password & Credential Vault</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 sm:p-6">
  <div class="max-w-xl mx-auto space-y-6">
    
    <header class="border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold text-teal-400">Credential Vault</h1>
      <p class="text-xs text-slate-400 mt-1">Disulitkan dengan AES sebelum dihantar ke Google Sheets</p>
    </header>

    <!-- Master Key Input -->
    <div class="bg-slate-800/80 p-4 rounded-xl border border-slate-700">
      <label class="block text-xs uppercase tracking-wider text-slate-400 mb-2">Master Key (Kunci Enkripsi)</label>
      <input type="password" id="masterKey" placeholder="Masukkan kunci rahsia anda..." 
        class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-400" />
      <span class="text-[11px] text-amber-400/90 mt-1 block">*Kata laluan disimpan tanpa kunci ini. Simpan kunci dengan selamat.</span>
    </div>

    <!-- Borang Tambah Rekod -->
    <form id="vaultForm" class="bg-slate-800/80 p-4 rounded-xl border border-slate-700 space-y-3">
      <h2 class="text-sm font-semibold text-slate-200">Tambah Kelayakan Baharu</h2>
      
      <div>
        <label class="block text-xs text-slate-400 mb-1">Nama Aplikasi / Servis</label>
        <input type="text" id="appName" placeholder="cth: Maybank2u, Gmail, GitHub" required
          class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-400" />
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">Username / ID / Emel</label>
        <input type="text" id="username" placeholder="cth: user@gmail.com" required
          class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-400" />
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">Kata Laluan</label>
        <input type="password" id="appPassword" placeholder="••••••••" required
          class="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-teal-400" />
      </div>

      <button type="submit" id="saveBtn"
        class="w-full bg-teal-500 hover:bg-teal-600 text-slate-950 font-semibold py-2 rounded-lg text-sm transition">
        Simpan Rekod
      </button>
    </form>

    <!-- Senarai Rekod -->
    <div class="space-y-3">
      <div class="flex items-center justify-between">
        <h2 class="text-sm font-semibold text-slate-200">Senarai Tersimpan</h2>
        <button id="refreshBtn" class="text-xs text-teal-400 hover:underline">Muat Semula</button>
      </div>
      <div id="recordsContainer" class="space-y-2">
        <p class="text-xs text-slate-500 italic">Memuatkan senarai...</p>
      </div>
    </div>

  </div>

  <script>
    // MASUKKAN URL WEB APP ANDA DI SINI
    const API_URL = "URL_GOOGLE_APPS_SCRIPT_ANDA";

    const form = document.getElementById('vaultForm');
    const masterKeyInput = document.getElementById('masterKey');
    const recordsContainer = document.getElementById('recordsContainer');
    const refreshBtn = document.getElementById('refreshBtn');

    // Simpan Rekod
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const masterKey = masterKeyInput.value.trim();
      if (!masterKey) {
        alert("Sila masukkan Master Key terlebih dahulu!");
        return;
      }

      const appName = document.getElementById('appName').value.trim();
      const username = document.getElementById('username').value.trim();
      const plainPassword = document.getElementById('appPassword').value;

      // Enkripsi AES di client-side
      const encryptedPassword = CryptoJS.AES.encrypt(plainPassword, masterKey).toString();

      const btn = document.getElementById('saveBtn');
      btn.disabled = true;
      btn.innerText = "Menyimpan...";

      try {
        await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "save", appName, username, encryptedPassword })
        });

        form.reset();
        loadRecords();
      } catch (err) {
        alert("Gagal menyimpan rekod: " + err.message);
      } finally {
        btn.disabled = false;
        btn.innerText = "Simpan Rekod";
      }
    });

    // Ambil & Papar Rekod
    async function loadRecords() {
      recordsContainer.innerHTML = `<p class="text-xs text-slate-500 italic">Mengambil data...</p>`;
      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "list" })
        });
        const data = await res.json();

        if (!data.records || data.records.length === 0) {
          recordsContainer.innerHTML = `<p class="text-xs text-slate-500 italic">Tiada rekod disimpan.</p>`;
          return;
        }

        renderList(data.records);
      } catch (err) {
        recordsContainer.innerHTML = `<p class="text-xs text-rose-400 italic">Ralat memuatkan rekod.</p>`;
      }
    }

    function renderList(records) {
      recordsContainer.innerHTML = "";
      const masterKey = masterKeyInput.value.trim();

      records.forEach(item => {
        let displayPassword = "••••••••";
        let isDecrypted = false;

        if (masterKey) {
          try {
            const bytes = CryptoJS.AES.decrypt(item.encryptedPassword, masterKey);
            const decrypted = bytes.toString(CryptoJS.enc.Utf8);
            if (decrypted) {
              displayPassword = decrypted;
              isDecrypted = true;
            }
          } catch (_) {}
        }

        const card = document.createElement('div');
        card.className = "bg-slate-800/60 border border-slate-700/80 p-3 rounded-lg flex items-center justify-between";
        card.innerHTML = `
          <div class="space-y-1">
            <p class="font-semibold text-sm text-slate-100">${escapeHtml(item.appName)}</p>
            <p class="text-xs text-slate-400">ID: <span class="text-slate-300 font-mono">${escapeHtml(item.username)}</span></p>
            <p class="text-xs text-slate-400">Pass: <span class="font-mono ${isDecrypted ? 'text-teal-300' : 'text-slate-500'}">${displayPassword}</span></p>
          </div>
          <div class="flex items-center space-x-2">
            <button onclick="navigator.clipboard.writeText('${isDecrypted ? displayPassword : ''}')" class="px-2 py-1 bg-slate-700 hover:bg-slate-600 rounded text-[11px] text-slate-200">Salin</button>
            <button onclick="deleteRecord('${item.id}')" class="px-2 py-1 bg-rose-950/60 border border-rose-900 text-rose-300 hover:bg-rose-900 rounded text-[11px]">Padam</button>
          </div>
        `;
        recordsContainer.appendChild(card);
      });
    }

    async function deleteRecord(id) {
      if (!confirm("Padam rekod ini?")) return;
      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "delete", id })
      });
      loadRecords();
    }

    function escapeHtml(str) {
      return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    masterKeyInput.addEventListener('input', () => {
      // Nyahsulit semula senarai sedia ada bila master key ditaip
      loadRecords();
    });

    refreshBtn.addEventListener('click', loadRecords);
    loadRecords();
  </script>
</body>
</html>
