<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ID & License Vault</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg-main: #090d16;
      --card-bg: rgba(22, 30, 46, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-inner: rgba(11, 17, 32, 0.85);
      --accent-primary: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --glass-blur: blur(16px);
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --safe-bottom: env(safe-area-inset-bottom, 16px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(37, 99, 235, 0.08) 0%, transparent 40%);
      background-attachment: fixed;
    }

    .app-shell {
      width: 100%;
      max-width: 480px;
      padding: 1rem 1rem calc(5.5rem + var(--safe-bottom)) 1rem;
      position: relative;
    }

    /* Glass Panels */
    .glass-card {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 1.25rem;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    /* Typography & Header */
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
      padding-top: 0.25rem;
    }

    .app-title {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      background: var(--success-bg);
      color: var(--success);
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      background: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    /* Form Controls */
    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 0.35rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input, select, textarea {
      width: 100%;
      background: var(--card-inner);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 0.85rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      margin-bottom: 0.9rem;
      outline: none;
      transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent-primary);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    /* Modern Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 0.9rem 1.25rem;
      border-radius: var(--radius-md);
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .btn-primary {
      background: var(--accent-gradient);
      color: #ffffff;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
    }

    .btn-primary:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:active {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-icon-sm {
      padding: 0.5rem 0.8rem;
      border-radius: var(--radius-sm);
      font-size: 0.8rem;
      font-weight: 600;
      border: 1px solid var(--card-border);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      text-decoration: none;
    }

    .btn-danger-sm {
      background: var(--danger-bg);
      color: #fca5a5;
      border-color: rgba(239, 68, 68, 0.25);
    }

    /* Category Filter Tabs (Pill Scroll) */
    .filter-tabs {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1rem;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
    }
    .filter-tabs::-webkit-scrollbar { display: none; }

    .tab-pill {
      white-space: nowrap;
      padding: 0.5rem 1rem;
      border-radius: 999px;
      font-size: 0.82rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-pill.active {
      background: var(--accent-gradient);
      color: #ffffff;
      border-color: transparent;
      box-shadow: 0 2px 10px rgba(56, 189, 248, 0.25);
    }

    /* Search Bar with Glass effect */
    .search-wrapper {
      position: relative;
      margin-bottom: 1rem;
    }

    .search-wrapper input {
      margin-bottom: 0;
      padding-left: 2.75rem;
      border-radius: 999px;
    }

    .search-icon {
      position: absolute;
      left: 1rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 1.1rem;
      pointer-events: none;
    }

    /* Document Card / Wallet Item */
    .doc-card {
      background: var(--card-bg);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      padding: 1.1rem;
      margin-bottom: 1rem;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }

    .doc-card:hover {
      border-color: rgba(56, 189, 248, 0.25);
    }

    .doc-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.6rem;
    }

    .doc-cat-tag {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent-primary);
      border: 1px solid rgba(56, 189, 248, 0.25);
    }

    .doc-name {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      margin-top: 0.35rem;
      line-height: 1.3;
    }

    .doc-id-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(0, 0, 0, 0.3);
      padding: 0.3rem 0.65rem;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 0.6rem;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .doc-img-container {
      position: relative;
      width: 100%;
      height: 180px;
      border-radius: var(--radius-md);
      overflow: hidden;
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.06);
      margin: 0.5rem 0 0.8rem 0;
      cursor: pointer;
    }

    .doc-img-preview {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s ease;
    }

    .doc-img-container:hover .doc-img-preview {
      transform: scale(1.03);
    }

    .doc-img-overlay {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #fff;
    }

    .pdf-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 120px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: var(--radius-md);
      border: 1px dashed var(--card-border);
      margin: 0.5rem 0 0.8rem 0;
    }

    .doc-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.8rem;
      padding-top: 0.8rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }

    /* Bottom Floating Action Bar */
    .floating-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: center;
      padding: 0.8rem 1rem calc(0.8rem + var(--safe-bottom)) 1rem;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: var(--glass-blur);
      -webkit-backdrop-filter: var(--glass-blur);
      border-top: 1px solid var(--card-border);
      z-index: 50;
    }

    .floating-bar-inner {
      width: 100%;
      max-width: 480px;
      display: flex;
      gap: 0.75rem;
    }

    /* Modals / Bottom Sheets */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .bottom-sheet {
      width: 100%;
      max-width: 500px;
      max-height: 90vh;
      background: #121a2c;
      border-top: 1px solid var(--card-border);
      border-radius: 28px 28px 0 0;
      padding: 1.5rem 1.25rem calc(1.5rem + var(--safe-bottom)) 1.25rem;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal-backdrop.active .bottom-sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 99px;
      margin: 0 auto 1.25rem auto;
    }

    .sheet-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .close-btn {
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text-main);
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
    }

    .hidden { display: none !important; }

    /* Fullscreen Media Viewer */
    .viewer-content {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 1rem;
    }
    .viewer-img {
      max-width: 100%;
      max-height: 75vh;
      object-fit: contain;
      margin: auto;
      border-radius: var(--radius-md);
    }
  </style>
</head>
<body>

<div class="app-shell">

  <!-- Skrin Kunci & Kata Laluan Utama -->
  <div id="authScreen" style="min-height: 80vh; display: flex; flex-direction: column; justify-content: center;">
    <div class="glass-card" style="text-align: center; padding: 2.25rem 1.5rem;">
      <div style="font-size: 3rem; margin-bottom: 1rem;">🛡️</div>
      <h1 class="app-title" style="font-size: 1.6rem; margin-bottom: 0.4rem;">ID Document Vault</h1>
      <p style="color: var(--text-muted); font-size: 0.88rem; line-height: 1.5; margin-bottom: 1.75rem;">
        Penyulitan gred tinggi (AES-256) peranti tempatan. Masukkan Master Password anda untuk membuka vault.
      </p>

      <div style="text-align: left;">
        <label>Master Password</label>
        <input type="password" id="masterKeyInput" placeholder="••••••••••••" autocomplete="current-password">
      </div>

      <button class="btn btn-primary" onclick="unlockVault()">
        <span>Buka Vault Dokumen</span>
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3"/></svg>
      </button>
    </div>
  </div>

  <!-- Dashboard Utama -->
  <div id="mainDashboard" class="hidden">
    <!-- Header -->
    <div class="header-bar">
      <div>
        <h1 class="app-title">ID Vault</h1>
        <div style="font-size: 0.78rem; color: var(--text-muted); margin-top: 2px;">Simpanan Kad & Dokumen Offline</div>
      </div>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <span class="status-badge"><span class="status-dot"></span> Offline</span>
        <button class="btn-icon-sm btn-danger-sm" onclick="lockVault()" title="Kunci">Kunci</button>
      </div>
    </div>

    <!-- Search Bar -->
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Cari IC, Lesen, Dokumen..." oninput="renderDocuments()">
    </div>

    <!-- Tab Penapis (Filter Categories) -->
    <div class="filter-tabs" id="categoryTabs">
      <button class="tab-pill active" onclick="setFilter('Semua', this)">Semua</button>
      <button class="tab-pill" onclick="setFilter('Kad Pengenalan (IC)', this)">Kad Pengenalan</button>
      <button class="tab-pill" onclick="setFilter('Lesen Memandu', this)">Lesen Memandu</button>
      <button class="tab-pill" onclick="setFilter('Kenderaan / Roadtax', this)">Kenderaan</button>
      <button class="tab-pill" onclick="setFilter('Kad Bank', this)">Kad Bank</button>
      <button class="tab-pill" onclick="setFilter('Lain-lain', this)">Lain-lain</button>
    </div>

    <!-- Senarai Dokumen -->
    <div id="docsList"></div>

    <!-- Pilihan Sandaran Fail -->
    <div class="glass-card" style="margin-top: 1.5rem; margin-bottom: 2rem;">
      <h3 style="font-size: 0.95rem; margin-bottom: 0.35rem; color: #fff;">Pusat Sandaran (Backup)</h3>
      <p style="font-size: 0.78rem; color: var(--text-muted); margin-bottom: 0.9rem;">
        Eksport pangkalan data tersulit untuk dipindahkan ke telefon pintar lain.
      </p>
      <div style="display: flex; gap: 0.5rem;">
        <button class="btn btn-secondary" style="padding: 0.6rem; font-size: 0.8rem;" onclick="exportVaultBackup()">Muat Turun Backup</button>
        <button class="btn btn-secondary" style="padding: 0.6rem; font-size: 0.8rem;" onclick="document.getElementById('importFileInput').click()">Import Backup</button>
      </div>
      <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importVaultBackup(event)">
    </div>
  </div>

</div>

<!-- Bottom Floating Action Bar -->
<div id="floatingBar" class="floating-bar hidden">
  <div class="floating-bar-inner">
    <button class="btn btn-primary" onclick="openAddModal()">
      <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/></svg>
      <span>Tambah Dokumen Baru</span>
    </button>
  </div>
</div>

<!-- Modal Borang Tambah Dokumen (Bottom Sheet) -->
<div id="addModal" class="modal-backdrop" onclick="closeModalOnBackdrop(event, 'addModal')">
  <div class="bottom-sheet">
    <div class="sheet-handle"></div>
    <div class="sheet-header">
      <h2 style="font-size: 1.15rem; color: #fff;">Muat Naik Dokumen</h2>
      <button class="close-btn" onclick="closeAddModal()">&times;</button>
    </div>

    <label>Kategori Dokumen</label>
    <select id="docCategory">
      <option value="Kad Pengenalan (IC)">Kad Pengenalan (IC)</option>
      <option value="Lesen Memandu">Lesen Memandu</option>
      <option value="Kenderaan / Roadtax">Kenderaan / Cukai Jalan</option>
      <option value="Kad Bank">Kad Bank / Debit</option>
      <option value="Lain-lain">Dokumen Rasmi / Lain-lain</option>
    </select>

    <label>Nama Dokumen</label>
    <input type="text" id="docTitle" placeholder="Contoh: MyKad (Depan & Belakang)">

    <label>No. Rujukan / Siri (Pilihan)</label>
    <input type="text" id="docIdentifier" placeholder="Contoh: 020216-11-XXXX">

    <label>Pilih Fail (Gambar/PDF)</label>
    <input type="file" id="docFileInput" accept="image/*,application/pdf">

    <label>Nota Tambahan (Pilihan)</label>
    <textarea id="docNotes" rows="2" placeholder="Contoh: Tarikh luput lesen, kelas D..."></textarea>

    <button class="btn btn-primary" id="saveBtn" onclick="saveDocument()">
      <span>Enkrip & Simpan ke Telefon</span>
    </button>
    <div id="uploadStatus" style="font-size: 0.8rem; color: var(--accent-primary); text-align: center; margin-top: 0.6rem;"></div>
  </div>
</div>

<!-- Modal Pratonton Skrin Penuh -->
<div id="viewModal" class="modal-backdrop" onclick="closeModalOnBackdrop(event, 'viewModal')">
  <div class="bottom-sheet" style="border-radius: var(--radius-lg); height: 90vh;">
    <div class="sheet-header">
      <h3 id="viewModalTitle" style="font-size: 1rem; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></h3>
      <button class="close-btn" onclick="closeViewModal()">&times;</button>
    </div>
    <div id="viewModalBody" style="width: 100%; height: calc(100% - 60px); display: flex; align-items: center; justify-content: center; overflow: hidden;"></div>
  </div>
</div>

<script>
  let sessionKey = null;
  let decryptedDocs = [];
  let currentFilter = 'Semua';
  const DB_NAME = 'OfflineIdVaultV2';
  const STORE_NAME = 'encrypted_docs';

  // --- IndexedDB ---
  function openDB() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, 1);
      request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, { keyPath: 'id' });
        }
      };
      request.onsuccess = () => resolve(request.result);
      request.onerror = () => reject(request.error);
    });
  }

  async function getEncryptedVault() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const store = tx.objectStore(STORE_NAME);
      const req = store.get('vault_payload');
      req.onsuccess = () => resolve(req.result ? req.result.payload : null);
      req.onerror = () => reject(req.error);
    });
  }

  async function setEncryptedVault(payload) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const store = tx.objectStore(STORE_NAME);
      const req = store.put({ id: 'vault_payload', payload: payload });
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  // --- Web Crypto (AES-256 GCM + PBKDF2) ---
  async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey(
      "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
    );
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt", "decrypt"]
    );
  }

  async function encryptData(plainText, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(password, salt);
    const enc = new TextEncoder();
    const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, enc.encode(plainText));

    return JSON.stringify({
      salt: Array.from(salt),
      iv: Array.from(iv),
      data: Array.from(new Uint8Array(ciphertext))
    });
  }

  async function decryptData(cipherPackage, password) {
    const pkg = typeof cipherPackage === 'string' ? JSON.parse(cipherPackage) : cipherPackage;
    const key = await deriveKey(password, new Uint8Array(pkg.salt));
    const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(pkg.iv) }, key, new Uint8Array(pkg.data));
    return new TextDecoder().decode(decrypted);
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve({ dataUrl: reader.result, name: file.name, type: file.type });
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // --- Auth & Session ---
  async function unlockVault() {
    const pwd = document.getElementById('masterKeyInput').value;
    if (!pwd) return alert("Sila masukkan kata laluan anda.");

    const rawStored = await getEncryptedVault();
    if (!rawStored) {
      sessionKey = pwd;
      decryptedDocs = [];
      showDashboard();
    } else {
      try {
        const decryptedStr = await decryptData(rawStored, pwd);
        decryptedDocs = JSON.parse(decryptedStr);
        sessionKey = pwd;
        showDashboard();
      } catch (err) {
        alert("Kata laluan tidak tepat!");
      }
    }
  }

  function showDashboard() {
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('mainDashboard').classList.remove('hidden');
    document.getElementById('floatingBar').classList.remove('hidden');
    renderDocuments();
  }

  function lockVault() {
    sessionKey = null;
    decryptedDocs = [];
    document.getElementById('masterKeyInput').value = '';
    document.getElementById('mainDashboard').classList.add('hidden');
    document.getElementById('floatingBar').classList.add('hidden');
    document.getElementById('authScreen').classList.remove('hidden');
  }

  // --- UI Modals ---
  function openAddModal() { document.getElementById('addModal').classList.add('active'); }
  function closeAddModal() { document.getElementById('addModal').classList.remove('active'); }
  function closeViewModal() { document.getElementById('viewModal').classList.remove('active'); }

  function closeModalOnBackdrop(e, modalId) {
    if (e.target.id === modalId) {
      document.getElementById(modalId).classList.remove('active');
    }
  }

  function setFilter(cat, elem) {
    currentFilter = cat;
    document.querySelectorAll('.tab-pill').forEach(btn => btn.classList.remove('active'));
    elem.classList.add('active');
    renderDocuments();
  }

  // --- Document Operations ---
  async function saveDocument() {
    const category = document.getElementById('docCategory').value;
    const title = document.getElementById('docTitle').value.trim();
    const identifier = document.getElementById('docIdentifier').value.trim();
    const notes = document.getElementById('docNotes').value.trim();
    const fileInput = document.getElementById('docFileInput');
    const status = document.getElementById('uploadStatus');

    if (!title) return alert("Sila isi tajuk dokumen.");
    if (fileInput.files.length === 0) return alert("Sila pilih fail imej atau PDF.");

    status.innerText = "Menyulitkan fail...";
    const fileObj = await fileToBase64(fileInput.files[0]);

    decryptedDocs.unshift({
      id: Date.now(),
      category,
      title,
      identifier,
      notes,
      file: fileObj,
      createdAt: new Date().toLocaleDateString('ms-MY')
    });

    const cipherText = await encryptData(JSON.stringify(decryptedDocs), sessionKey);
    await setEncryptedVault(cipherText);

    // Reset Form
    document.getElementById('docTitle').value = '';
    document.getElementById('docIdentifier').value = '';
    document.getElementById('docNotes').value = '';
    fileInput.value = '';
    status.innerText = "";

    closeAddModal();
    renderDocuments();
  }

  async function deleteDoc(id) {
    if (!confirm("Padam dokumen ini dari peranti anda?")) return;
    decryptedDocs = decryptedDocs.filter(d => d.id !== id);
    const cipherText = await encryptData(JSON.stringify(decryptedDocs), sessionKey);
    await setEncryptedVault(cipherText);
    renderDocuments();
  }

  function renderDocuments() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const container = document.getElementById('docsList');
    container.innerHTML = '';

    const filtered = decryptedDocs.filter(d => {
      const matchFilter = currentFilter === 'Semua' || d.category === currentFilter;
      const matchSearch = d.title.toLowerCase().includes(query) || 
                          (d.identifier && d.identifier.toLowerCase().includes(query)) ||
                          (d.notes && d.notes.toLowerCase().includes(query));
      return matchFilter && matchSearch;
    });

    if (filtered.length === 0) {
      container.innerHTML = `
        <div style="text-align: center; padding: 3rem 1rem; color: var(--text-muted);">
          <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">📂</div>
          <p style="font-size: 0.9rem;">Tiada dokumen dijumpai.</p>
        </div>
      `;
      return;
    }

    filtered.forEach(item => {
      const isImg = item.file && item.file.type.startsWith('image/');
      const isPdf = item.file && item.file.type === 'application/pdf';

      const card = document.createElement('div');
      card.className = 'doc-card';
      card.innerHTML = `
        <div class="doc-top">
          <span class="doc-cat-tag">${escapeHtml(item.category)}</span>
          <button class="btn-icon-sm btn-danger-sm" onclick="deleteDoc(${item.id})">Padam</button>
        </div>
        <h3 class="doc-name">${escapeHtml(item.title)}</h3>
        
        ${item.identifier ? `
          <div class="doc-id-pill" onclick="copyText('${escapeJs(item.identifier)}')">
            <span>${escapeHtml(item.identifier)}</span>
            <span style="font-size: 0.7rem; color: var(--accent-primary);">📋 Salin</span>
          </div>` : ''}

        ${isImg ? `
          <div class="doc-img-container" onclick="openImageViewer('${item.file.dataUrl}', '${escapeJs(item.title)}')">
            <img src="${item.file.dataUrl}" class="doc-img-preview" alt="Preview">
            <div class="doc-img-overlay">🔍 Sentuh untuk Paparan Penuh</div>
          </div>
        ` : ''}

        ${isPdf ? `
          <div class="pdf-placeholder" onclick="openPdfViewer('${item.file.dataUrl}', '${escapeJs(item.title)}')">
            <span style="font-size: 2rem;">📄</span>
            <span style="font-size: 0.85rem; font-weight: 600; margin-top: 0.3rem; color: #fff;">${escapeHtml(item.file.name || 'Dokumen PDF')}</span>
            <span style="font-size: 0.72rem; color: var(--accent-primary); margin-top: 0.2rem;">Sentuh untuk Buka PDF</span>
          </div>
        ` : ''}

        ${item.notes ? `<p style="font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.5rem; line-height: 1.4;">${escapeHtml(item.notes)}</p>` : ''}

        <div class="doc-actions">
          <span style="font-size: 0.75rem; color: var(--text-muted);">${item.createdAt || ''}</span>
          <a class="btn-icon-sm" href="${item.file.dataUrl}" download="${item.file.name || 'dokumen'}">
            ⬇️ Muat Turun Fail
          </a>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function openImageViewer(dataUrl, title) {
    document.getElementById('viewModalTitle').innerText = title;
    document.getElementById('viewModalBody').innerHTML = `<img src="${dataUrl}" class="viewer-img">`;
    document.getElementById('viewModal').classList.add('active');
  }

  function openPdfViewer(dataUrl, title) {
    document.getElementById('viewModalTitle').innerText = title;
    document.getElementById('viewModalBody').innerHTML = `<iframe src="${dataUrl}" style="width:100%; height:100%; border:none; border-radius: 12px;"></iframe>`;
    document.getElementById('viewModal').classList.add('active');
  }

  function copyText(text) {
    navigator.clipboard.writeText(text);
    alert("Nombor ID disalin!");
  }

  async function exportVaultBackup() {
    const rawData = await getEncryptedVault();
    if (!rawData) return alert("Tiada data untuk dieksport.");
    const blob = new Blob([rawData], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ID-Vault-Backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
  }

  function importVaultBackup(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = async function(e) {
      try {
        const importedPayload = e.target.result;
        const testDecrypt = await decryptData(importedPayload, sessionKey);
        decryptedDocs = JSON.parse(testDecrypt);
        await setEncryptedVault(importedPayload);
        renderDocuments();
        alert("Sandaran berjaya dipulihkan!");
      } catch (err) {
        alert("Gagal memulihkan fail. Kata laluan tidak sepadan.");
      }
    };
    reader.readAsText(file);
  }

  function escapeHtml(str) {
    return (str || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
  }
  function escapeJs(str) {
    return (str || '').replace(/'/g, "\\'").replace(/"/g, '\\"');
  }

  // Daftarkan Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(console.error);
    });
  }
</script>
</body>
</html>
