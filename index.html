<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>PocketVault • Kad & Dokumen</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#030712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    :root {
      --bg: #030712;
      --card-glass: rgba(17, 24, 39, 0.75);
      --border-subtle: rgba(255, 255, 255, 0.08);
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
      --emerald: #10b981;
      --amber: #f59e0b;
      --rose: #f43f5e;
      --purple: #a855f7;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --safe-bottom: env(safe-area-inset-bottom, 16px);
      --safe-top: env(safe-area-inset-top, 16px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      background-image: 
        radial-gradient(at 0% 0%, rgba(56, 189, 248, 0.12) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(168, 85, 247, 0.1) 0px, transparent 50%);
      background-attachment: fixed;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      padding: calc(1rem + var(--safe-top)) 1.25rem calc(6rem + var(--safe-bottom)) 1.25rem;
      position: relative;
    }

    /* Glass Effect Utility */
    .glass {
      background: var(--card-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border-subtle);
    }

    /* Top Bar */
    .top-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.5rem;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .dot-pulse {
      width: 8px;
      height: 8px;
      background: var(--emerald);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--emerald);
    }

    .lock-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border-subtle);
      background: rgba(244, 63, 94, 0.1);
      color: var(--rose);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Wallet Metrics Banner */
    .vault-summary {
      border-radius: 24px;
      padding: 1.4rem;
      margin-bottom: 1.5rem;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .vault-summary::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -20%;
      width: 150px;
      height: 150px;
      background: var(--accent);
      filter: blur(60px);
      opacity: 0.15;
      pointer-events: none;
    }

    .summary-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 700; margin-bottom: 4px; }
    .summary-counter { font-size: 2rem; font-weight: 800; letter-spacing: -0.03em; color: #fff; }

    /* Category Pill Selectors */
    .category-scroll {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 0.5rem;
      margin-bottom: 1.25rem;
      scrollbar-width: none;
    }
    .category-scroll::-webkit-scrollbar { display: none; }

    .cat-btn {
      padding: 8px 16px;
      border-radius: 14px;
      font-size: 0.82rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-muted);
      border: 1px solid var(--border-subtle);
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .cat-btn.active {
      background: #fff;
      color: #030712;
      border-color: #fff;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2);
    }

    /* Interactive Wallet Cards */
    .id-card {
      border-radius: 22px;
      padding: 1.25rem;
      margin-bottom: 1.2rem;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .id-card:active { transform: scale(0.98); }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
    }

    .chip-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 8px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .chip-ic { background: rgba(56, 189, 248, 0.15); color: var(--accent); border: 1px solid rgba(56, 189, 248, 0.3); }
    .chip-license { background: rgba(245, 158, 11, 0.15); color: var(--amber); border: 1px solid rgba(245, 158, 11, 0.3); }
    .chip-car { background: rgba(16, 185, 129, 0.15); color: var(--emerald); border: 1px solid rgba(16, 185, 129, 0.3); }
    .chip-bank { background: rgba(168, 85, 247, 0.15); color: var(--purple); border: 1px solid rgba(168, 85, 247, 0.3); }

    .card-title { font-size: 1.15rem; font-weight: 700; color: #fff; margin-bottom: 0.35rem; }
    
    .card-number {
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      font-size: 0.95rem;
      letter-spacing: 0.06em;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 12px;
      border-radius: 10px;
      margin-bottom: 0.8rem;
    }

    .card-preview-box {
      width: 100%;
      height: 190px;
      border-radius: 14px;
      overflow: hidden;
      background: #000;
      position: relative;
      cursor: pointer;
      border: 1px solid var(--border-subtle);
      margin-bottom: 0.8rem;
    }

    .card-preview-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-badge-overlay {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(6px);
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 600;
      color: #fff;
    }

    .card-footer-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 0.6rem;
      border-top: 1px solid var(--border-subtle);
    }

    .btn-action-ghost {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }

    /* Fixed Bottom Navigation */
    .dock-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.75rem 1.25rem calc(0.75rem + var(--safe-bottom)) 1.25rem;
      display: flex;
      justify-content: center;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-top: 1px solid var(--border-subtle);
      z-index: 40;
    }

    .dock-inner {
      width: 100%;
      max-width: 440px;
      display: flex;
      gap: 10px;
    }

    .add-floating-btn {
      flex: 1;
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%);
      color: #fff;
      border: none;
      padding: 1rem;
      border-radius: 18px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 20px var(--accent-glow);
    }

    .backup-icon-btn {
      width: 52px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-subtle);
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.2rem;
    }

    /* Input Styling */
    input, select, textarea {
      width: 100%;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 0.9rem 1rem;
      border-radius: 14px;
      font-size: 0.95rem;
      margin-bottom: 0.9rem;
      outline: none;
    }

    input:focus, select:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    /* Modals & Overlay */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 100;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal.active { opacity: 1; pointer-events: auto; }

    .modal-sheet {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      background: #0f172a;
      border-radius: 28px 28px 0 0;
      border-top: 1px solid var(--border-subtle);
      padding: 1.5rem 1.25rem calc(1.5rem + var(--safe-bottom)) 1.25rem;
      max-height: 88vh;
      overflow-y: auto;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .modal.active .modal-sheet { transform: translateY(0); }

    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="app-container">

  <!-- Skrin Kunci (Master Key) -->
  <div id="authScreen" style="min-height: 85vh; display: flex; flex-direction: column; justify-content: center;">
    <div class="glass" style="border-radius: 28px; padding: 2.2rem 1.5rem; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.6);">
      <div style="width: 60px; height: 60px; background: rgba(56,189,248,0.1); border: 1px solid var(--border-subtle); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.2rem auto; font-size: 1.8rem;">
        🔐
      </div>
      <h1 style="font-size: 1.5rem; font-weight: 800; margin-bottom: 0.3rem;">PocketVault</h1>
      <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.8rem;">Enkripsi AES-256 luar talian. Masukkan Master Password untuk membuka akses.</p>

      <input type="password" id="masterKeyInput" placeholder="Master Password" style="text-align: center; letter-spacing: 0.1em;" autocomplete="current-password">
      <button class="add-floating-btn" style="width: 100%; margin-top: 0.5rem;" onclick="unlockVault()">Buka Vault</button>
    </div>
  </div>

  <!-- Dashboard Utama -->
  <div id="mainDashboard" class="hidden">
    <!-- Top Nav -->
    <div class="top-nav">
      <div class="user-pill glass">
        <span class="dot-pulse"></span>
        <span>Storan Tempatan (Offline)</span>
      </div>
      <button class="lock-btn" onclick="lockVault()" title="Kunci Semula">🔒</button>
    </div>

    <!-- Summary Box -->
    <div class="vault-summary glass">
      <div class="summary-title">Jumlah Dokumen Disimpan</div>
      <div class="summary-counter" id="totalDocsCounter">0</div>
    </div>

    <!-- Search Input -->
    <input type="text" id="searchInput" placeholder="🔍  Cari dokumen / no kad..." oninput="renderDocuments()" style="border-radius: 16px; margin-bottom: 1rem;">

    <!-- Categories Tab -->
    <div class="category-scroll">
      <button class="cat-btn active" onclick="filterCategory('Semua', this)">Semua</button>
      <button class="cat-btn" onclick="filterCategory('Kad Pengenalan (IC)', this)">Kad Pengenalan</button>
      <button class="cat-btn" onclick="filterCategory('Lesen Memandu', this)">Lesen Memandu</button>
      <button class="cat-btn" onclick="filterCategory('Kenderaan / Roadtax', this)">Kenderaan</button>
      <button class="cat-btn" onclick="filterCategory('Kad Bank', this)">Kad Bank</button>
      <button class="cat-btn" onclick="filterCategory('Lain-lain', this)">Lain-lain</button>
    </div>

    <!-- Senarai Kad Dokumen -->
    <div id="docsList"></div>
  </div>

</div>

<!-- Bottom Navigation Bar -->
<div id="dockNav" class="dock-nav hidden">
  <div class="dock-inner">
    <button class="add-floating-btn" onclick="openModal('addModal')">
      <span>＋ Tambah Dokumen Baru</span>
    </button>
    <button class="backup-icon-btn" onclick="openModal('backupModal')" title="Sandaran Fail">
      💾
    </button>
  </div>
</div>

<!-- Modal Tambah Dokumen -->
<div id="addModal" class="modal" onclick="closeOnBackdrop(event, 'addModal')">
  <div class="modal-sheet">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem;">
      <h3 style="font-size: 1.2rem; font-weight: 700;">Tambah Dokumen</h3>
      <button onclick="closeModal('addModal')" style="background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer;">&times;</button>
    </div>

    <label style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700;">Kategori</label>
    <select id="docCategory">
      <option value="Kad Pengenalan (IC)">Kad Pengenalan (IC)</option>
      <option value="Lesen Memandu">Lesen Memandu</option>
      <option value="Kenderaan / Roadtax">Kenderaan / Roadtax</option>
      <option value="Kad Bank">Kad Bank / Debit</option>
      <option value="Lain-lain">Lain-lain Dokumen</option>
    </select>

    <label style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700;">Label / Nama</label>
    <input type="text" id="docTitle" placeholder="Contoh: MyKad (Depan & Belakang)">

    <label style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700;">Nombor ID (Pilihan)</label>
    <input type="text" id="docIdentifier" placeholder="Contoh: 020216-11-XXXX">

    <label style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700;">Pilih Fail (Gambar / PDF)</label>
    <input type="file" id="docFileInput" accept="image/*,application/pdf">

    <label style="font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); font-weight: 700;">Nota</label>
    <textarea id="docNotes" rows="2" placeholder="Catatan tambahan..."></textarea>

    <button class="add-floating-btn" style="width: 100%; margin-top: 0.5rem;" onclick="saveDocument()">Enkrip & Simpan</button>
  </div>
</div>

<!-- Modal Backup -->
<div id="backupModal" class="modal" onclick="closeOnBackdrop(event, 'backupModal')">
  <div class="modal-sheet">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.2rem;">
      <h3 style="font-size: 1.2rem; font-weight: 700;">Pusat Sandaran</h3>
      <button onclick="closeModal('backupModal')" style="background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer;">&times;</button>
    </div>
    <p style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1.2rem;">Eksport atau import fail sandaran (.json) tersulit untuk dipindahkan ke peranti lain.</p>
    
    <button class="add-floating-btn" style="width: 100%; margin-bottom: 0.8rem;" onclick="exportVaultBackup()">Muat Turun Fail Sandaran</button>
    <input type="file" id="importFileInput" accept=".json" class="hidden" onchange="importVaultBackup(event)">
    <button class="add-floating-btn" style="width: 100%; background: rgba(255,255,255,0.08); border: 1px solid var(--border-subtle); box-shadow: none;" onclick="document.getElementById('importFileInput').click()">Pulihkan Sandaran (Import)</button>
  </div>
</div>

<!-- Modal Viewer -->
<div id="viewModal" class="modal" onclick="closeOnBackdrop(event, 'viewModal')">
  <div class="modal-sheet" style="height: 90vh;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.8rem;">
      <h4 id="viewTitle" style="color: #fff; font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;"></h4>
      <button onclick="closeModal('viewModal')" style="background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer;">&times;</button>
    </div>
    <div id="viewBody" style="width: 100%; height: calc(100% - 50px); display: flex; align-items: center; justify-content: center;"></div>
  </div>
</div>

<script>
  let sessionKey = null;
  let decryptedDocs = [];
  let currentCategory = 'Semua';
  const DB_NAME = 'PocketVaultDB';
  const STORE_NAME = 'docs_store';

  // --- IndexedDB ---
  function openDB() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NAME, 1);
      req.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) db.createObjectStore(STORE_NAME, { keyPath: 'id' });
      };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function getVaultPayload() {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readonly');
      const req = tx.objectStore(STORE_NAME).get('vault_payload');
      req.onsuccess = () => resolve(req.result ? req.result.payload : null);
      req.onerror = () => reject(req.error);
    });
  }

  async function setVaultPayload(payload) {
    const db = await openDB();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, 'readwrite');
      const req = tx.objectStore(STORE_NAME).put({ id: 'vault_payload', payload: payload });
      req.onsuccess = () => resolve();
      req.onerror = () => reject(req.error);
    });
  }

  // --- Crypto AES-256 GCM ---
  async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await crypto.subtle.importKey("raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]);
    return crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
      keyMaterial,
      { name: "AES-GCM", length: 256 },
      false,
      ["encrypt", "decrypt"]
    );
  }

  async function encryptData(plainText, password) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(password, salt);
    const enc = new TextEncoder();
    const ciphertext = await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, key, enc.encode(plainText));
    return JSON.stringify({ salt: Array.from(salt), iv: Array.from(iv), data: Array.from(new Uint8Array(ciphertext)) });
  }

  async function decryptData(cipherPackage, password) {
    const pkg = typeof cipherPackage === 'string' ? JSON.parse(cipherPackage) : cipherPackage;
    const key = await deriveKey(password, new Uint8Array(pkg.salt));
    const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv: new Uint8Array(pkg.iv) }, key, new Uint8Array(pkg.data));
    return new TextDecoder().decode(decrypted);
  }

  function fileToBase64(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve({ dataUrl: reader.result, name: file.name, type: file.type });
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  // --- Auth & Operations ---
  async function unlockVault() {
    const pwd = document.getElementById('masterKeyInput').value;
    if (!pwd) return alert("Sila masukkan kata laluan.");

    const raw = await getVaultPayload();
    if (!raw) {
      sessionKey = pwd;
      decryptedDocs = [];
      showApp();
    } else {
      try {
        const decryptedStr = await decryptData(raw, pwd);
        decryptedDocs = JSON.parse(decryptedStr);
        sessionKey = pwd;
        showApp();
      } catch (err) {
        alert("Master Password salah!");
      }
    }
  }

  function showApp() {
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('mainDashboard').classList.remove('hidden');
    document.getElementById('dockNav').classList.remove('hidden');
    renderDocuments();
  }

  function lockVault() {
    sessionKey = null;
    decryptedDocs = [];
    document.getElementById('masterKeyInput').value = '';
    document.getElementById('mainDashboard').classList.add('hidden');
    document.getElementById('dockNav').classList.add('hidden');
    document.getElementById('authScreen').classList.remove('hidden');
  }

  function openModal(id) { document.getElementById(id).classList.add('active'); }
  function closeModal(id) { document.getElementById(id).classList.remove('active'); }
  function closeOnBackdrop(e, id) { if (e.target.id === id) closeModal(id); }

  function filterCategory(cat, el) {
    currentCategory = cat;
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    renderDocuments();
  }

  async function saveDocument() {
    const category = document.getElementById('docCategory').value;
    const title = document.getElementById('docTitle').value.trim();
    const identifier = document.getElementById('docIdentifier').value.trim();
    const notes = document.getElementById('docNotes').value.trim();
    const fileInput = document.getElementById('docFileInput');

    if (!title) return alert("Sila letakkan tajuk dokumen.");
    if (fileInput.files.length === 0) return alert("Pilih satu fail gambar/PDF.");

    const fileObj = await fileToBase64(fileInput.files[0]);

    decryptedDocs.unshift({
      id: Date.now(),
      category,
      title,
      identifier,
      notes,
      file: fileObj,
      createdAt: new Date().toLocaleDateString('ms-MY')
    });

    const encrypted = await encryptData(JSON.stringify(decryptedDocs), sessionKey);
    await setVaultPayload(encrypted);

    document.getElementById('docTitle').value = '';
    document.getElementById('docIdentifier').value = '';
    document.getElementById('docNotes').value = '';
    fileInput.value = '';

    closeModal('addModal');
    renderDocuments();
  }

  async function deleteDoc(id) {
    if (!confirm("Padam dokumen ini dari storan telefon?")) return;
    decryptedDocs = decryptedDocs.filter(d => d.id !== id);
    const encrypted = await encryptData(JSON.stringify(decryptedDocs), sessionKey);
    await setVaultPayload(encrypted);
    renderDocuments();
  }

  function getCategoryChip(cat) {
    if (cat.includes('IC')) return '<span class="chip-badge chip-ic">KAD PENGENALAN</span>';
    if (cat.includes('Lesen')) return '<span class="chip-badge chip-license">LESEN MEMANDU</span>';
    if (cat.includes('Kenderaan')) return '<span class="chip-badge chip-car">KENDERAAN</span>';
    if (cat.includes('Bank')) return '<span class="chip-badge chip-bank">KAD BANK</span>';
    return '<span class="chip-badge" style="background: rgba(255,255,255,0.1); color: #fff;">DOKUMEN</span>';
  }

  function renderDocuments() {
    const query = document.getElementById('searchInput').value.toLowerCase();
    const list = document.getElementById('docsList');
    list.innerHTML = '';

    document.getElementById('totalDocsCounter').innerText = decryptedDocs.length;

    const filtered = decryptedDocs.filter(d => {
      const matchCat = currentCategory === 'Semua' || d.category === currentCategory;
      const matchQ = d.title.toLowerCase().includes(query) || (d.identifier && d.identifier.toLowerCase().includes(query));
      return matchCat && matchQ;
    });

    if (filtered.length === 0) {
      list.innerHTML = `
        <div style="text-align: center; padding: 3rem 1rem; color: var(--text-muted);">
          <div style="font-size: 2.2rem; margin-bottom: 0.4rem;">📁</div>
          <p style="font-size: 0.85rem;">Tiada dokumen dalam senarai.</p>
        </div>
      `;
      return;
    }

    filtered.forEach(item => {
      const isImg = item.file && item.file.type.startsWith('image/');
      const card = document.createElement('div');
      card.className = 'id-card glass';
      card.innerHTML = `
        <div class="card-header-row">
          ${getCategoryChip(item.category)}
          <button class="btn-action-ghost" style="color: var(--rose);" onclick="deleteDoc(${item.id})">Padam</button>
        </div>

        <div class="card-title">${escapeHtml(item.title)}</div>

        ${item.identifier ? `
          <div class="card-number" onclick="copyText('${escapeJs(item.identifier)}')">
            <span>${escapeHtml(item.identifier)}</span>
            <span style="font-size: 0.72rem; color: var(--accent);">SALIN</span>
          </div>
        ` : ''}

        ${isImg ? `
          <div class="card-preview-box" onclick="openPreview('${item.file.dataUrl}', '${escapeJs(item.title)}')">
            <img src="${item.file.dataUrl}" alt="Preview">
            <div class="preview-badge-overlay">🔍 Sentuh untuk Paparan Penuh</div>
          </div>
        ` : `
          <div class="card-preview-box" style="display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.4);" onclick="openPreview('${item.file.dataUrl}', '${escapeJs(item.title)}')">
            <span style="font-size: 2.2rem;">📄</span>
            <span style="font-size: 0.85rem; font-weight: 600; margin-top: 4px; color: #fff;">${escapeHtml(item.file.name)}</span>
          </div>
        `}

        ${item.notes ? `<p style="font-size: 0.8rem; color: var(--text-muted); margin-bottom: 0.6rem;">${escapeHtml(item.notes)}</p>` : ''}

        <div class="card-footer-row">
          <span style="font-size: 0.75rem; color: var(--text-muted);">${item.createdAt}</span>
          <a class="btn-action-ghost" href="${item.file.dataUrl}" download="${item.file.name || 'document'}">
            ⬇️ Muat Turun Salinan
          </a>
        </div>
      `;
      list.appendChild(card);
    });
  }

  function openPreview(url, title) {
    document.getElementById('viewTitle').innerText = title;
    const body = document.getElementById('viewBody');
    if (url.startsWith('data:image/')) {
      body.innerHTML = `<img src="${url}" style="max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 14px;">`;
    } else {
      body.innerHTML = `<iframe src="${url}" style="width: 100%; height: 100%; border: none; border-radius: 14px;"></iframe>`;
    }
    openModal('viewModal');
  }

  function copyText(txt) {
    navigator.clipboard.writeText(txt);
    alert("Nombor ID berjaya disalin!");
  }

  async function exportVaultBackup() {
    const raw = await getVaultPayload();
    if (!raw) return alert("Tiada data untuk dieksport.");
    const blob = new Blob([raw], { type: "application/json" });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `PocketVault-Backup-${new Date().toISOString().slice(0, 10)}.json`;
    a.click();
  }

  function importVaultBackup(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async (e) => {
      try {
        const payload = e.target.result;
        const decryptedStr = await decryptData(payload, sessionKey);
        decryptedDocs = JSON.parse(decryptedStr);
        await setVaultPayload(payload);
        closeModal('backupModal');
        renderDocuments();
        alert("Sandaran berjaya dipulihkan!");
      } catch (err) {
        alert("Gagal memulihkan sandaran. Kata laluan tidak sepadan.");
      }
    };
    reader.readAsText(file);
  }

  function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
  function escapeJs(s) { return (s || '').replace(/'/g, "\\'").replace(/"/g, '\\"'); }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(console.error));
  }
</script>
</body>
</html>
